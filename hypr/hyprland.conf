# Pomodoro panel: float it, fixed size, near the top.
# Paste into ~/.config/hypr/hyprland.conf, then: hyprctl reload
windowrule = float true, match:class ^io\.github\.hawkaii\.pomodoro$
windowrule = size 300 340, match:class ^io\.github\.hawkaii\.pomodoro$
windowrule = move 940 40, match:class ^io\.github\.hawkaii\.pomodoro$
